name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          npm install -g html-validate
          html-validate "*.html"

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: >-
            --no-progress
            --exclude 'og-image\.png'
            '*.html'
          fail: true

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::623859664281:role/LinuxQuestDeployRole
          aws-region: ap-south-1

      - name: Sync to S3
        run: |
          aws s3 sync . s3://linuxquest-cloud \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude "STYLE.md" \
            --exclude "CLAUDE.md" \
            --exclude "CONTRIBUTING.md" \
            --exclude "LICENSE"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E182NK0Q0YDNT3 \
            --paths "/*"