<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinuxQuest — Scenario</title>
  <meta name="description" content="Hands-on Linux and DevOps practice scenario on LinuxQuest. Free, no login required.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LinuxQuest">
  <meta property="og:title" content="LinuxQuest — Hands-on Linux Practice">
  <meta property="og:description" content="Free hands-on Linux and DevOps scenarios. Practice real-world skills, no setup required.">
  <meta property="og:url" content="https://linuxquest.online/scenario.html">
  <meta property="og:image" content="https://linuxquest.online/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="LinuxQuest — Hands-on Linux Practice">
  <meta name="twitter:description" content="Free hands-on Linux and DevOps scenarios. Practice real-world skills, no setup required.">
  <meta name="twitter:image" content="https://linuxquest.online/assets/og-image.png">
  <link rel="icon" type="image/svg+xml" href="assets/linuxquest_logo.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────────────── -->
  <nav class="nav scrolled" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="assets/linuxquest_logo.svg" alt="LinuxQuest" class="nav-logo-img">
      </a>
      <div class="nav-links">
        <a href="index.html#standalone" class="nav-link">PRACTICE</a>
        <a href="index.html#tracks" class="nav-link">TRACKS</a>
        <a href="https://github.com/HassanAbdullahHere/linux-quest"
           class="nav-link" target="_blank" rel="noopener">GITHUB</a>
      </div>
      <button type="button" class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="nav-mobile" id="nav-mobile">
      <a href="index.html#standalone" class="nav-mobile-link">PRACTICE</a>
      <a href="index.html#tracks" class="nav-mobile-link">TRACKS</a>
      <a href="https://github.com/HassanAbdullahHere/linux-quest"
         class="nav-mobile-link" target="_blank" rel="noopener">GITHUB</a>
    </div>
  </nav>

  <!-- ── Scenario Main ──────────────────────────────────────────────── -->
  <main class="sp-main">
    <div class="sp-inner">

      <!-- Top bar: back + track progress -->
      <div class="sp-topbar">
        <a href="index.html" class="sp-back">← SCENARIOS</a>
        <div id="track-nav" hidden></div>
      </div>

      <!-- States -->
      <p class="state-msg" id="sp-loading">LOADING SCENARIO…</p>
      <p class="state-msg" id="sp-error" hidden>SCENARIO NOT FOUND.</p>

      <!-- Scenario body (injected) -->
      <div id="sp-body" hidden>

        <!-- Header -->
        <header class="sp-header">
          <div class="sp-header-meta" id="sp-meta"></div>
          <h1 class="sp-title" id="sp-title">LOADING SCENARIO…</h1>
        </header>

        <!-- 01 — The Problem -->
        <section class="sp-section animate">
          <p class="sp-section-label">01 — THE PROBLEM</p>
          <div class="sp-section-body">
            <p class="sp-problem" id="sp-problem"></p>
          </div>
        </section>

        <!-- 02 — Useful Commands -->
        <section class="sp-section animate" id="sp-cmds-section">
          <p class="sp-section-label">02 — USEFUL COMMANDS</p>
          <div class="sp-section-body">
            <div id="sp-commands" class="sp-tags"></div>
          </div>
        </section>

        <!-- 03 — Setup -->
        <section class="sp-section animate" id="sp-setup-section">
          <p class="sp-section-label">03 — SETUP</p>
          <div class="sp-section-body">
            <p class="sp-prose" id="sp-setup-desc"></p>
            <div id="sp-setup-cmds" class="sp-cmd-list"></div>
            <p class="sp-note" id="sp-setup-note" hidden></p>
            <p class="sp-prose sp-muted" id="sp-setup-verify" hidden></p>
          </div>
        </section>

        <!-- 04 — Hints -->
        <section class="sp-section animate">
          <p class="sp-section-label">04 — HINTS</p>
          <div class="sp-section-body">
            <div id="sp-hints" class="sp-hints"></div>
          </div>
        </section>

        <!-- 05 — Solution -->
        <section class="sp-section animate">
          <p class="sp-section-label">05 — SOLUTION</p>
          <div class="sp-section-body">
            <div class="sp-solution-header">
              <button type="button" class="sp-toggle" id="sp-solution-toggle">
                <span class="sp-toggle-icon">▶</span> SHOW SOLUTION
              </button>
              <button type="button" class="sp-copy-all-btn" id="sp-copy-all-btn" hidden>COPY ALL</button>
            </div>
            <div class="sp-solution-wrap" id="sp-solution" hidden></div>
          </div>
        </section>

        <!-- Actions -->
        <div class="sp-actions">
          <button type="button" class="sp-complete-btn" id="sp-complete-btn">MARK COMPLETE</button>
          <button type="button" class="sp-reset-btn" id="sp-reset-btn" hidden>RESET TRACK</button>
        </div>

        <!-- ── Share Section ─────────────────────────── -->
        <div class="share-section">
          <span class="share-label">Share this scenario</span>
          <div class="share-buttons">
            <button type="button" class="share-btn share-btn--copy" id="shareCopyBtn" onclick="copyScenarioLink()">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              Copy Link
            </button>
            <a id="twitterShare" class="share-btn share-btn--x" href="#" target="_blank" rel="noopener noreferrer">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              Post on X
            </a>
            <button type="button" class="share-btn share-btn--linkedin" onclick="openLinkedInShare()">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
              Share on LinkedIn
            </button>
          </div>
        </div>

        <!-- Next scenario (track only, shown after mark complete) -->
        <div id="sp-next-wrap" hidden></div>

      </div><!-- /sp-body -->
    </div><!-- /sp-inner -->

  </main>

  <!-- ── Footer ─────────────────────────────────────────────────────── -->
  <footer class="footer">
    <div class="footer-inner">
      <a href="index.html" class="nav-logo footer-logo">
        <img src="assets/linuxquest_logo.svg" alt="LinuxQuest" class="nav-logo-img">
      </a>
      <p class="footer-text">FREE AND OPEN SOURCE. NO LOGIN. NO COST.</p>
      <a href="https://github.com/HassanAbdullahHere/linux-quest"
         class="footer-link" target="_blank" rel="noopener">CONTRIBUTE ON GITHUB →</a>
    </div>
  </footer>

  <script src="assets/js/scenario.js"></script>
</body>
</html>
